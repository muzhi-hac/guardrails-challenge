# German mobile-network customer service assistant.
#
# Routing is deliberately non-monotonic. CRITICAL maps to safe_fallback rather
# than handover because the critical findings here are injection (user turn
# or retrieved document) and outbound PII: in those cases the reply must not
# reach the user *or* be pushed into a human agent's queue verbatim. HIGH —
# an ungrounded pricing or policy claim — is exactly the case a human should
# answer, so it escalates.

name: telco_de
brand_name: TeleNova
locale: de-DE

models:
  chat: claude-opus-5
  # Measured 2026-08-25 with forced tool choice: sonnet median 3583 ms versus
  # opus 6303 ms, with identical decisions in all three constrained probes.
  judge: claude-sonnet-5
  judge_effort: low
  judge_min_budget_ms: 4000

routing:
  none: continue
  low: continue          # logged, not acted on: a single over-long sentence
  medium: rewrite        # repair the offending span, then re-verify
  high: handover         # a person answers questions about price and policy
  critical: safe_fallback

guards:
  persona:
    persona:
      address_form: formal        # de-DE -> Sie/Ihnen/Ihr*, never du
      emoji_allowed: false
      forbidden_phrases:
        - "kein Ding"
        - "null Problemo"
        - "Alter"
        - "krass"
      max_sentence_words: 25
      tts_safe: true
      tone: ["formal", "empathetic", "precise"]

  tone: {}                 # dimensions come from persona.tone, one source of truth

  grounding:
    check_entities: ["number", "price", "date", "duration"]
    allowed_commitments:
      - schedule_callback
      - send_confirmation_email
    escalate_below_confidence: 0.8
    severity_overrides:
      unsupported_commitment: critical   # promising a refund is worse than
                                         # merely stating an unsupported fact

  injection:
    cross_turn_window: 5

  document:
    scan_retrieved_documents: true

  pii:
    redact_inbound: true
    entities: ["iban", "phone", "customer_id", "birthdate", "address"]
    on_timeout: critical    # overrides the mode default, including in voice:
    on_error: critical      # a PII check that did not run is not a pass

modes:
  voice:
    budget_ms: 150
    # The 3583 ms measured judge median is over 24x this 150 ms budget, so
    # excluding tier 1 is a measured constraint, not an intuition.
    max_tier: 0             # deterministic checks only
    on_timeout: none        # fail open: stalling a live call costs more than
    on_error: none          # the residual risk of one unchecked turn
    routing:
      medium: handover      # no mid-call rewrite; pass the caller to a person

  chat:
    # The former 1500 ms budget predated any judge. The 3583 ms measurement
    # proved it would time out every turn and fail closed; 5000 ms leaves room.
    budget_ms: 5000
    max_tier: 1             # tier-1 judges permitted
    on_timeout: high        # fail closed
    on_error: high

fallback_message: >-
  Dazu liegen mir keine gesicherten Informationen vor. Ich möchte Ihnen nichts
  Falsches sagen und leite Sie gern an den Kundenservice weiter.

handover_message: >-
  Einen Moment bitte, ich übergebe an eine Kollegin oder einen Kollegen aus dem
  Kundenservice.
